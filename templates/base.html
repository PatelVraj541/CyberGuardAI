<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}CyberGuard AI{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <nav class="navbar">
            <ul>
                <li>
                <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='img/logo_light.png') }}" alt="CyberGuard AI Logo" width="120" height="40" class="logo_light"></a>
                <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='img/logo_dark.png') }}" alt="CyberGuard AI Logo" width="120" height="30" class="logo_dark"></a>
                </li>
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('detection') }}">Detection</a></li>
                <li><a href="{{ url_for('alerts') }}">Alerts</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
        </nav>
        <main>
        {% block content %}{% endblock %}
        </main>
    <nav class="navbar_bottom">
        <footer>
            <p>&copy; 2026 CyberGuard AI. All rights reserved.</p>
        </footer>
    </nav>
    </body>
    <script>
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    </script>
</html>
